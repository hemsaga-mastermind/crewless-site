# Cloudflare Workers static site (migrated from Pages).
# Required so PR/preview builds (`wrangler versions upload`) know the assets root.
# Production dashboard deploy previously passed --assets implicitly; preview did not.
#
# Living proof page lives at /whats-real/ (renamed from /build/ so Workers Builds /
# dash deploy never treat a top-level compile-output folder as assets root).
# assets.directory must stay "." so the whole site publishes.
# Workers Builds deploy command MUST be: npx wrangler deploy
# (never --assets ./build or --assets ./whats-real).
name = "crewless-site"
account_id = "d2891f2421efdeb5a31b6b6fde4bc5b9"
compatibility_date = "2026-10-02"

[assets]
directory = "."
html_handling = "auto-trailing-slash"
# Blank null-body 404s dump strangers; serve nearest 404.html with HTTP 404.
not_found_handling = "404-page"
