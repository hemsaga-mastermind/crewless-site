# Phase B — pack-ask ledger + ops email (enterprise inbox).
# SSOT: docs/crewless-pack-ask-enterprise-inbox.md
# Deploy path: git push main → Cloudflare Workers Builds (no local wrangler OAuth).
# Secrets optional for formspree mode. ntfy NOT required for ok:true.
# KV PACK_ASKS: omit until real namespace id (REPLACE placeholder breaks Builds).
# Founder: create KV "PACK_ASKS" in CF dash → write id to ~/.crewless/pack_asks_kv_id → re-run ONE_SHOT.
name = "crewless-site"
account_id = "d2891f2421efdeb5a31b6b6fde4bc5b9"
compatibility_date = "2026-10-02"
main = "worker.js"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
PACK_ASK_OPS_TO = "admin@dancing-flamingo.org"
PACK_ASK_OPS_NOTIFY_MODE = "formspree"
